name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned so a public build is reproducible: pdfium binaries from bblanchon/pdfium-binaries.
  PDFIUM_TAG: chromium/8125

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup target add ${{ matrix.target }}

      - name: Version metadata consistent
        shell: pwsh
        run: ./scripts/check-versions.ps1

      - name: PDFium
        shell: pwsh
        run: |
          $tag = $env:PDFIUM_TAG -replace '/', '%2F'
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/download/$tag/pdfium-win-${{ matrix.arch }}.tgz"
          curl.exe -fsSL -o pdfium.tgz $url
          if (!(Test-Path pdfium.tgz) -or (Get-Item pdfium.tgz).Length -lt 100000) { throw "pdfium download failed: $url" }
          tar -xzf pdfium.tgz
          $dll = Get-ChildItem -Recurse -Filter pdfium.dll | Select-Object -First 1
          if (-not $dll) { throw "pdfium.dll missing inside pdfium-win-${{ matrix.arch }}.tgz" }
          Copy-Item $dll.FullName "pdfium-${{ matrix.arch }}.dll"
          Get-FileHash "pdfium-${{ matrix.arch }}.dll" -Algorithm SHA256 | Format-List

      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage/zPDF-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/zpdf.exe" "$stage/zPDF.exe"
          Copy-Item "README.md", "LICENSE" "$stage"
          if (Test-Path "pdfium-${{ matrix.arch }}.dll") {
            Copy-Item "pdfium-${{ matrix.arch }}.dll" "$stage/pdfium.dll"
          } elseif (Test-Path "pdfium.dll") {
            Copy-Item "pdfium.dll" "$stage/pdfium.dll"
          } else {
            # Never ship a package without the renderer: the app cannot open a PDF without it.
            throw "pdfium.dll not staged - refusing to build an unusable package"
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "zPDF-${{ matrix.arch }}.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DArch=${{ matrix.arch }}" installer.iss
          if (!(Test-Path "zPDF-Setup-${{ matrix.arch }}.exe")) { throw "installer not produced" }

      # Signing: enable once SignPath Foundation approves the project (free for OSS).
      # The action submits an unsigned request, SignPath returns the signed artifact.
      # - name: Sign (SignPath Foundation)
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: zpdf
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zPDF-${{ matrix.arch }}
          path: |
            zPDF-${{ matrix.arch }}.zip
            zPDF-Setup-${{ matrix.arch }}.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
